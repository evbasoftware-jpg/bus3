<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a58e6"/>
      <stop offset="50%" stop-color="#0d62f0"/>
      <stop offset="100%" stop-color="#0748c9"/>
    </linearGradient>

    <!-- Globe Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1665d8"/>
      <stop offset="40%" stop-color="#093d96"/>
      <stop offset="80%" stop-color="#041d4e"/>
      <stop offset="100%" stop-color="#020e29"/>
    </radialGradient>

    <!-- Circuit Trace Gradients -->
    <linearGradient id="traceYellow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>

    <linearGradient id="traceCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="70%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>

    <linearGradient id="traceGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Chip Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- Left: AI Microchip Globe Sphere -->
  <g transform="translate(150, 145)">
    <!-- Base Sphere -->
    <circle cx="0" cy="0" r="105" fill="url(#sphereGrad)"/>
    
    <!-- Outer rim atmospheric glow -->
    <circle cx="0" cy="0" r="104" fill="none" stroke="#38b6ff" stroke-width="2.5" opacity="0.6"/>

    <!-- Circuit Tracks Left (Cyan / Blue) -->
    <!-- Arc 1 -->
    <path d="M -80 -10 A 82 82 0 0 0 -35 75 L -35 85" fill="none" stroke="url(#traceCyan)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-35" cy="85" r="5" fill="#00e5ff"/>

    <!-- Arc 2 -->
    <path d="M -92 10 A 92 92 0 0 0 -60 70 L -50 82" fill="none" stroke="url(#traceCyan)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-50" cy="82" r="4.5" fill="#00b0ff"/>

    <!-- Arc 3 -->
    <path d="M -70 -50 A 85 85 0 0 0 -95 0 L -80 0" fill="none" stroke="url(#traceGreen)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-80" cy="0" r="4" fill="#00ffcc"/>

    <!-- Circuit Tracks Center to Bottom -->
    <path d="M -15 25 L -15 65 A 75 75 0 0 1 -75 25" fill="none" stroke="url(#traceCyan)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-75" cy="25" r="4.5" fill="#80d8ff"/>

    <path d="M 0 25 L 0 85" fill="none" stroke="url(#traceCyan)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="85" r="5" fill="#00e5ff"/>

    <path d="M 18 25 L 18 70 A 75 75 0 0 0 65 35" fill="none" stroke="url(#traceYellow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="35" r="5" fill="#ffb700"/>

    <!-- Circuit Tracks Top Right (Yellow / Orange / Green) -->
    <path d="M 22 -20 L 22 -78" fill="none" stroke="url(#traceYellow)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="-78" r="6" fill="#ffd600"/>

    <path d="M 40 -15 L 40 -65 A 80 80 0 0 0 65 -40" fill="none" stroke="url(#traceYellow)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="65" cy="-40" r="5.5" fill="#ffab00"/>

    <path d="M 3 -22 L 3 -88" fill="none" stroke="url(#traceYellow)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="3" cy="-88" r="5.5" fill="#ffea00"/>

    <path d="M -18 -20 L -18 -68 L -35 -78" fill="none" stroke="url(#traceYellow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-35" cy="-78" r="5" fill="#00e5ff"/>

    <path d="M -40 -15 A 50 50 0 0 1 -20 -45 L -20 -70" fill="none" stroke="url(#traceGreen)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-20" cy="-70" r="4.5" fill="#00ffcc"/>

    <!-- Connecting Bus Nodes -->
    <path d="M -60 -45 A 75 75 0 0 1 0 -75" fill="none" stroke="url(#traceCyan)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-60" cy="-45" r="4" fill="#00b0ff"/>

    <!-- Center Microchip -->
    <rect x="-24" y="-24" width="48" height="48" rx="7" fill="#ffffff" filter="url(#glow)"/>
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#f0f7ff"/>
    
    <!-- Chip Connection Pins -->
    <line x1="-24" y1="-12" x2="-29" y2="-12" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-24" y1="0" x2="-29" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-24" y1="12" x2="-29" y2="12" stroke="#ffffff" stroke-width="2.5"/>

    <line x1="24" y1="-12" x2="29" y2="-12" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="24" y1="0" x2="29" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="24" y1="12" x2="29" y2="12" stroke="#ffffff" stroke-width="2.5"/>

    <line x1="-12" y1="-24" x2="-12" y2="-29" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="0" y1="-24" x2="0" y2="-29" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="12" y1="-24" x2="12" y2="-29" stroke="#ffffff" stroke-width="2.5"/>

    <line x1="-12" y1="24" x2="-12" y2="29" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="0" y1="24" x2="0" y2="29" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="12" y1="24" x2="12" y2="29" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Indian Tricolor Wave Swoosh -->
  <!-- Bottom swoosh under globe -->
  <path d="M 60 228 Q 110 262 180 238" fill="none" stroke="#ff7700" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Main flowing tricolor ribbon across right -->
  <!-- Saffron Ribbon -->
  <path d="M 125 252 C 230 252 280 178 440 168 C 600 158 720 188 880 184 L 880 196 C 720 200 600 170 440 180 C 280 190 230 264 125 264 Z" 
        fill="#ff7700"/>

  <!-- White Ribbon -->
  <path d="M 125 264 C 230 264 280 190 440 180 C 600 170 720 200 880 196 L 880 206 C 720 210 600 180 440 190 C 280 200 230 274 125 274 Z" 
        fill="#ffffff"/>

  <!-- Green Ribbon -->
  <path d="M 125 274 C 230 274 280 200 440 190 C 600 180 720 210 880 206 L 880 218 C 720 222 600 192 440 202 C 280 212 230 286 125 286 Z" 
        fill="#048828"/>

  <!-- Typography: AI ONLINE -->
  <!-- "AI" in light cyan / sky blue -->
  <text x="305" y="146" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="118" fill="#6bc4ff" letter-spacing="-2">AI</text>
  
  <!-- "ONLINE" in solid bright white -->
  <text x="445" y="146" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="118" fill="#ffffff" letter-spacing="1">ONLINE</text>

  <!-- Typography: Digital Support India -->
  <text x="368" y="272" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="0.5">Digital Support India</text>
</svg>
